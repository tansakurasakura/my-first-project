<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂互动系统</title>
<style>
  :root {
    --primary: #4A90D9;
    --primary-dark: #357ABD;
    --accent: #FF9800;
    --accent-dark: #E68900;
    --success: #4CAF50;
    --danger: #F44336;
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #333333;
    --text-light: #666666;
    --border: #e0e0e0;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 10px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 16px;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
  }

  /* ========== 认证页面 ========== */
  .auth-card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 40px 30px;
    margin-top: 60px;
    text-align: center;
  }

  .auth-card h1 {
    font-size: 28px;
    margin-bottom: 8px;
    color: var(--primary);
  }

  .auth-card .subtitle {
    color: var(--text-light);
    margin-bottom: 30px;
    font-size: 14px;
  }

  .auth-tabs {
    display: flex;
    background: #f5f5f5;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }

  .auth-tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
    border-radius: 8px;
    transition: all 0.2s;
    font-family: inherit;
    color: var(--text-light);
  }

  .auth-tab.active {
    background: white;
    color: var(--primary);
    font-weight: bold;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  .form-group {
    margin-bottom: 18px;
    text-align: left;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: var(--text-light);
    font-weight: 500;
  }

  .form-group input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 2px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  .form-group input:focus {
    border-color: var(--primary);
  }

  .role-selector {
    display: flex;
    gap: 12px;
  }

  .role-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: white;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.2s;
    font-family: inherit;
    text-align: center;
  }

  .role-btn:hover {
    border-color: var(--primary);
  }

  .role-btn.selected {
    border-color: var(--primary);
    background: #e8f0fe;
    color: var(--primary);
    font-weight: bold;
  }

  .btn {
    padding: 12px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
    font-family: inherit;
    width: 100%;
  }

  .btn-primary {
    background: var(--primary);
    color: white;
  }

  .btn-primary:hover {
    background: var(--primary-dark);
  }

  .btn-accent {
    background: var(--accent);
    color: white;
  }

  .btn-accent:hover {
    background: var(--accent-dark);
  }

  .btn-danger {
    background: var(--danger);
    color: white;
  }

  .btn-danger:hover {
    opacity: 0.9;
  }

  .btn-sm {
    padding: 8px 16px;
    font-size: 14px;
    width: auto;
  }

  .error-msg {
    color: var(--danger);
    font-size: 13px;
    margin-top: 6px;
  }

  /* ========== 主页面 ========== */
  .header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .header .user-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }

  .badge-teacher {
    background: #fff3e0;
    color: var(--accent);
  }

  .badge-student {
    background: #e8f0fe;
    color: var(--primary);
  }

  .online-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-light);
  }

  .online-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ========== 卡片 ========== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
  }

  .card h3 {
    font-size: 18px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .question-display {
    background: #fafafa;
    border-left: 4px solid var(--accent);
    padding: 16px 20px;
    border-radius: 0 8px 8px 0;
    font-size: 20px;
    line-height: 1.8;
    min-height: 50px;
  }

  .question-meta {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 8px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  .input-row input {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    border: 2px solid var(--border);
    border-radius: 8px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  .input-row input:focus {
    border-color: var(--primary);
  }

  /* ========== 答案墙 ========== */
  .answer-wall {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 500px;
    overflow-y: auto;
  }

  .answer-card {
    background: #f9f9f9;
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity:0; transform:translateY(-10px); }
    to { opacity:1; transform:translateY(0); }
  }

  .answer-card .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    flex-shrink: 0;
  }

  .answer-card .answer-content {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }

  .answer-card .answer-time {
    font-size: 11px;
    color: var(--text-light);
    flex-shrink: 0;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
  }

  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 10px;
  }

  /* ========== 响应式 ========== */
  @media (max-width: 600px) {
    .container { padding: 12px; }
    .auth-card { padding: 24px 18px; margin-top: 20px; }
    .auth-card h1 { font-size: 22px; }
    .input-row { flex-direction: column; }
    .header { flex-direction: column; align-items: flex-start; }
    .question-display { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="container" id="app">

  <!-- ==================== 登录/注册页面 ==================== -->
  <div class="auth-card" id="authView">
    <h1>欢迎进入课堂互动</h1>
    <p class="subtitle">在线答题 · 实时互动 · 多端同步</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">登录</button>
      <button class="auth-tab" id="registerTab" onclick="switchTab('register')">注册</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>用户名</label>
        <input id="loginUsername" placeholder="请输入用户名" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input id="loginPassword" type="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <div id="loginError" class="error-msg" style="display:none"></div>
      <button type="submit" class="btn btn-primary" style="margin-top:8px">登 录</button>
    </form>

    <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>用户名</label>
        <input id="regUsername" placeholder="2-20个字符" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input id="regPassword" type="password" placeholder="至少4位密码" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>选择身份</label>
        <div class="role-selector">
          <div class="role-btn selected" id="roleStudent" onclick="selectRole('student')">学生</div>
          <div class="role-btn" id="roleTeacher" onclick="selectRole('teacher')">教师</div>
        </div>
      </div>
      <div id="regError" class="error-msg" style="display:none"></div>
      <button type="submit" class="btn btn-accent" style="margin-top:8px">注 册</button>
    </form>
  </div>

  <!-- ==================== 主页面（登录后可见） ==================== -->
  <div id="mainView" style="display:none">

    <div class="header">
      <div class="user-info">
        <span id="headerUsername" style="font-weight:600"></span>
        <span id="headerBadge" class="badge"></span>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div class="online-indicator">
          <span class="online-dot"></span>
          <span id="onlineCount">在线: 0</span>
        </div>
        <button class="btn btn-sm" style="background:#eee;color:var(--text)" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div class="card" id="teacherPanel" style="display:none">
      <h3>教师控制面板</h3>
      <div class="input-row">
        <input id="questionInput" placeholder="输入新的课堂题目" maxlength="200">
        <button class="btn btn-accent btn-sm" onclick="setQuestion()">发布题目</button>
      </div>
      <div style="margin-top:8px">
        <button class="btn btn-danger btn-sm" onclick="clearAnswers()">清空所有答案</button>
      </div>
    </div>

    <div class="card" id="questionCard">
      <h3 id="questionTitle">当前题目</h3>
      <div class="question-display" id="questionText">请等待老师出题...</div>
      <div class="question-meta" id="questionMeta"></div>
    </div>

    <div class="card" id="studentPanel" style="display:none">
      <h3>提交你的答案</h3>
      <div class="input-row">
        <input id="answerInput" placeholder="在此输入你的答案..." maxlength="500">
        <button class="btn btn-primary btn-sm" onclick="submitAnswer()">提交</button>
      </div>
      <div id="answerError" class="error-msg" style="display:none"></div>
    </div>

    <div class="card">
      <h3>
        答案展示墙
        <span style="font-size:13px;font-weight:normal;color:var(--text-light);margin-left:4px" id="answerCount"></span>
      </h3>
      <div class="answer-wall" id="answerWall">
        <div class="empty-state">
          <div class="icon"></div>
          <p>还没有人提交答案，快来抢沙发吧！</p>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
let currentUser = null
let selectedRole = 'student'
let pollTimer = null
let knownAnswerIds = new Set()
let lastQuestionText = ''

const API = '/api'

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' }
  if (currentUser && currentUser.token) {
    headers['Authorization'] = 'Bearer ' + currentUser.token
  }
  const opts = { method, headers }
  if (body) opts.body = JSON.stringify(body)
  const res = await fetch(API + path, opts)
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || '请求失败')
  return data
}

function switchTab(tab) {
  document.getElementById('loginTab').classList.toggle('active', tab === 'login')
  document.getElementById('registerTab').classList.toggle('active', tab === 'register')
  document.getElementById('loginForm').style.display = tab === 'login' ? '' : 'none'
  document.getElementById('registerForm').style.display = tab === 'register' ? '' : 'none'
  document.getElementById('loginError').style.display = 'none'
  document.getElementById('regError').style.display = 'none'
}

function selectRole(role) {
  selectedRole = role
  document.getElementById('roleStudent').classList.toggle('selected', role === 'student')
  document.getElementById('roleTeacher').classList.toggle('selected', role === 'teacher')
}

async function handleLogin(e) {
  e.preventDefault()
  const username = document.getElementById('loginUsername').value.trim()
  const password = document.getElementById('loginPassword').value
  const errEl = document.getElementById('loginError')
  errEl.style.display = 'none'

  try {
    const data = await api('POST', '/login', { username, password })
    setCurrentUser(data)
    showMainView()
  } catch (err) {
    errEl.textContent = err.message
    errEl.style.display = ''
  }
}

async function handleRegister(e) {
  e.preventDefault()
  const username = document.getElementById('regUsername').value.trim()
  const password = document.getElementById('regPassword').value
  const errEl = document.getElementById('regError')
  errEl.style.display = 'none'

  try {
    const data = await api('POST', '/register', { username, password, role: selectedRole })
    setCurrentUser(data)
    showMainView()
  } catch (err) {
    errEl.textContent = err.message
    errEl.style.display = ''
  }
}

function setCurrentUser(data) {
  currentUser = { username: data.username, role: data.role, token: data.token }
  sessionStorage.setItem('auth', JSON.stringify(currentUser))
}

function showMainView() {
  document.getElementById('authView').style.display = 'none'
  document.getElementById('mainView').style.display = ''

  document.getElementById('headerUsername').textContent = currentUser.username

  const badge = document.getElementById('headerBadge')
  if (currentUser.role === 'teacher') {
    badge.textContent = '教师'
    badge.className = 'badge badge-teacher'
  } else {
    badge.textContent = '学生'
    badge.className = 'badge badge-student'
  }

  document.getElementById('teacherPanel').style.display = currentUser.role === 'teacher' ? '' : 'none'
  document.getElementById('studentPanel').style.display = currentUser.role === 'student' ? '' : 'none'
  document.getElementById('questionTitle').textContent = currentUser.role === 'teacher' ? '当前题目（发布后学生可见）' : '当前题目'

  startPolling()
}

function logout() {
  stopPolling()
  currentUser = null
  knownAnswerIds.clear()
  lastQuestionText = ''
  sessionStorage.removeItem('auth')

  document.getElementById('authView').style.display = ''
  document.getElementById('mainView').style.display = 'none'
  document.getElementById('loginUsername').value = ''
  document.getElementById('loginPassword').value = ''
  document.getElementById('regUsername').value = ''
  document.getElementById('regPassword').value = ''
  document.getElementById('answerWall').innerHTML = '<div class="empty-state"><div class="icon"></div><p>还没有人提交答案，快来抢沙发吧！</p></div>'
  document.getElementById('questionText').textContent = '请等待老师出题...'
  document.getElementById('questionMeta').textContent = ''
  document.getElementById('answerCount').textContent = ''
  document.getElementById('onlineCount').textContent = '在线: 0'
}

async function setQuestion() {
  const input = document.getElementById('questionInput')
  const text = input.value.trim()
  if (!text) return
  try {
    await api('POST', '/question', { question: text })
    input.value = ''
    await loadQuestion()
    await loadAnswers()
  } catch (err) {
    alert(err.message)
  }
}

async function submitAnswer() {
  const input = document.getElementById('answerInput')
  const errEl = document.getElementById('answerError')
  const text = input.value.trim()
  errEl.style.display = 'none'

  if (!text) return
  try {
    const data = await api('POST', '/answer', { answer: text })
    input.value = ''
    knownAnswerIds.add(data.id)
    addAnswerToWall(data, true)
    updateAnswerCount()
  } catch (err) {
    errEl.textContent = err.message
    errEl.style.display = ''
  }
}

async function clearAnswers() {
  if (!confirm('确定要清空所有答案吗？此操作不可撤销。')) return
  try {
    await api('DELETE', '/answers')
    knownAnswerIds.clear()
    document.getElementById('answerWall').innerHTML = '<div class="empty-state"><div class="icon"></div><p>还没有人提交答案，快来抢沙发吧！</p></div>'
    document.getElementById('answerCount').textContent = ''
  } catch (err) {
    alert(err.message)
  }
}

async function loadQuestion() {
  try {
    const data = await api('GET', '/question')
    const text = data.text || '请等待老师出题...'
    document.getElementById('questionText').textContent = text
    if (data.setBy && data.setBy !== lastQuestionText) {
      lastQuestionText = data.setBy + '_' + data.timestamp
      document.getElementById('questionMeta').textContent = '由 ' + data.setBy + ' 发布于 ' + formatTime(data.timestamp)
    }
  } catch (err) {
    // ignore polling errors
  }
}

async function loadAnswers() {
  try {
    const data = await api('GET', '/answers')
    if (!Array.isArray(data)) return
    let hasNew = false
    for (const ans of data) {
      if (!knownAnswerIds.has(ans.id)) {
        knownAnswerIds.add(ans.id)
        addAnswerToWall(ans, false)
        hasNew = true
      }
    }
    if (hasNew) updateAnswerCount()
  } catch (err) {
    // ignore polling errors
  }
}

async function loadOnlineCount() {
  try {
    const data = await api('GET', '/online')
    document.getElementById('onlineCount').textContent =
      '在线: ' + data.total + '（学生 ' + data.students + ' / 教师 ' + data.teachers + '）'
  } catch (err) {
    // ignore polling errors
  }
}

function addAnswerToWall(ans, prepend) {
  const wall = document.getElementById('answerWall')
  const emptyEl = wall.querySelector('.empty-state')
  if (emptyEl) emptyEl.remove()

  const card = document.createElement('div')
  card.className = 'answer-card'
  card.setAttribute('data-answer-id', ans.id)

  if (prepend) {
    card.style.animation = 'none'
    card.offsetHeight
    card.style.animation = 'slideIn 0.3s ease'
  }

  const avatar = document.createElement('div')
  avatar.className = 'avatar'
  avatar.textContent = (ans.username || '?')[0].toUpperCase()

  const content = document.createElement('div')
  content.className = 'answer-content'
  content.textContent = ans.answer

  const time = document.createElement('div')
  time.className = 'answer-time'
  time.textContent = formatTime(ans.timestamp)

  card.appendChild(avatar)
  card.appendChild(content)
  card.appendChild(time)

  if (prepend) {
    wall.insertBefore(card, wall.firstChild)
  } else {
    wall.appendChild(card)
  }
}

function updateAnswerCount() {
  const count = document.querySelectorAll('.answer-card').length
  document.getElementById('answerCount').textContent = count > 0 ? '（共 ' + count + ' 条）' : ''
}

function formatTime(ts) {
  const d = new Date(ts)
  const pad = n => String(n).padStart(2, '0')
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds())
}

function startPolling() {
  if (pollTimer) return
  loadQuestion()
  loadAnswers()
  loadOnlineCount()
  pollTimer = setInterval(() => {
    loadQuestion()
    loadAnswers()
    loadOnlineCount()
  }, 1500)
}

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer)
    pollTimer = null
  }
}

(function init() {
  const saved = sessionStorage.getItem('auth')
  if (saved) {
    try {
      const data = JSON.parse(saved)
      currentUser = data
      api('GET', '/me').then(() => {
        showMainView()
      }).catch(() => {
        sessionStorage.removeItem('auth')
        currentUser = null
      })
    } catch (e) {
      sessionStorage.removeItem('auth')
    }
  }
})()
</script>
</body>
</html>
