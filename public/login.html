<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 课堂互动问答</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "微软雅黑", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .container {
    background: #fff; border-radius: 20px; padding: 48px 40px;
    width: 420px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .container h2 {
    text-align: center; font-size: 26px; color: #1a1a2e; margin-bottom: 8px;
  }
  .container .subtitle {
    text-align: center; font-size: 14px; color: #999; margin-bottom: 32px;
  }
  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block; font-size: 14px; font-weight: 600; color: #555; margin-bottom: 6px;
  }
  .form-group input {
    width: 100%; padding: 14px 16px; font-size: 16px;
    border: 2px solid #e8e8e8; border-radius: 10px; outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: #667eea; }
  button {
    width: 100%; padding: 14px; font-size: 17px; font-weight: 700;
    border: none; border-radius: 10px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    transition: opacity 0.2s, transform 0.1s;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: #f44336; font-size: 14px; margin-top: 8px; text-align: center; display: none; }
  .error.show { display: block; }
  .link { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
  .link a { color: #667eea; text-decoration: none; font-weight: 600; }
  .link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h2>📚 登录</h2>
  <div class="subtitle">课堂互动问答平台</div>

  <div class="form-group">
    <label>用户名</label>
    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
  </div>

  <button id="submitBtn" onclick="login()">登 录</button>
  <div class="error" id="errorMsg"></div>

  <div class="link">
    没有账号？<a href="/register.html">立即注册</a>
  </div>
</div>

<script>
async function login() {
  const username = document.getElementById("username").value.trim()
  const password = document.getElementById("password").value
  const errorEl = document.getElementById("errorMsg")
  const btn = document.getElementById("submitBtn")

  errorEl.classList.remove("show")

  if (!username) { showError("请输入用户名"); return }
  if (!password) { showError("请输入密码"); return }

  btn.disabled = true
  btn.textContent = "登录中..."

  try {
    const resp = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    })
    const data = await resp.json()
    if (!resp.ok) {
      showError(data.error || "登录失败")
      return
    }

    localStorage.setItem("auth_token", data.token)
    localStorage.setItem("auth_username", data.username)
    localStorage.setItem("auth_role", data.role)

    location.href = "/index.html"
  } catch (e) {
    showError("网络错误，请稍后重试")
  } finally {
    btn.disabled = false
    btn.textContent = "登 录"
  }
}

function showError(msg) {
  const el = document.getElementById("errorMsg")
  el.textContent = msg
  el.classList.add("show")
}

document.getElementById("password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") login()
})
</script>
</body>
</html>
