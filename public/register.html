<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 课堂互动问答</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "微软雅黑", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .container {
    background: #fff; border-radius: 20px; padding: 48px 40px;
    width: 420px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .container h2 {
    text-align: center; font-size: 26px; color: #1a1a2e; margin-bottom: 8px;
  }
  .container .subtitle {
    text-align: center; font-size: 14px; color: #999; margin-bottom: 32px;
  }
  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block; font-size: 14px; font-weight: 600; color: #555; margin-bottom: 6px;
  }
  .form-group input {
    width: 100%; padding: 14px 16px; font-size: 16px;
    border: 2px solid #e8e8e8; border-radius: 10px; outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: #667eea; }
  .role-group { display: flex; gap: 12px; }
  .role-option {
    flex: 1; padding: 14px; border: 2px solid #e8e8e8; border-radius: 10px;
    text-align: center; cursor: pointer; transition: all 0.2s; font-size: 15px;
  }
  .role-option:hover { border-color: #667eea; background: #f8f9ff; }
  .role-option.selected { border-color: #667eea; background: #f0f1ff; font-weight: 700; }
  .role-option .icon { font-size: 28px; display: block; margin-bottom: 4px; }
  button {
    width: 100%; padding: 14px; font-size: 17px; font-weight: 700;
    border: none; border-radius: 10px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    transition: opacity 0.2s, transform 0.1s;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: #f44336; font-size: 14px; margin-top: 8px; text-align: center; display: none; }
  .error.show { display: block; }
  .success { color: #4caf50; font-size: 14px; margin-top: 8px; text-align: center; display: none; }
  .success.show { display: block; }
  .link { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
  .link a { color: #667eea; text-decoration: none; font-weight: 600; }
  .link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h2>📝 注册账号</h2>
  <div class="subtitle">课堂互动问答平台</div>

  <div class="form-group">
    <label>用户名</label>
    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="请输入密码" autocomplete="new-password">
  </div>
  <div class="form-group">
    <label>确认密码</label>
    <input type="password" id="confirmPassword" placeholder="请再次输入密码" autocomplete="new-password">
  </div>
  <div class="form-group">
    <label>选择角色</label>
    <div class="role-group">
      <div class="role-option" data-role="teacher" onclick="selectRole('teacher', this)">
        <span class="icon">👩‍🏫</span>老师
      </div>
      <div class="role-option" data-role="student" onclick="selectRole('student', this)">
        <span class="icon">👨‍🎓</span>学生
      </div>
    </div>
  </div>

  <button id="submitBtn" onclick="register()">注 册</button>
  <div class="error" id="errorMsg"></div>
  <div class="success" id="successMsg"></div>

  <div class="link">
    已有账号？<a href="/login.html">立即登录</a>
  </div>
</div>

<script>
let selectedRole = ""

function selectRole(role, el) {
  selectedRole = role
  document.querySelectorAll(".role-option").forEach(o => o.classList.remove("selected"))
  el.classList.add("selected")
  document.getElementById("errorMsg").classList.remove("show")
}

async function register() {
  const username = document.getElementById("username").value.trim()
  const password = document.getElementById("password").value
  const confirmPassword = document.getElementById("confirmPassword").value
  const errorEl = document.getElementById("errorMsg")
  const successEl = document.getElementById("successMsg")
  const btn = document.getElementById("submitBtn")

  errorEl.classList.remove("show")
  successEl.classList.remove("show")

  if (!username) { showError("请输入用户名"); return }
  if (username.length < 2) { showError("用户名至少2个字符"); return }
  if (!password) { showError("请输入密码"); return }
  if (password.length < 4) { showError("密码至少4个字符"); return }
  if (password !== confirmPassword) { showError("两次密码输入不一致"); return }
  if (!selectedRole) { showError("请选择角色"); return }

  btn.disabled = true
  btn.textContent = "注册中..."

  try {
    const resp = await fetch("/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, role: selectedRole }),
    })
    const data = await resp.json()
    if (!resp.ok) {
      showError(data.error || "注册失败")
      return
    }
    successEl.textContent = "注册成功！3 秒后跳转到登录页..."
    successEl.classList.add("show")
    setTimeout(() => { location.href = "/login.html" }, 2000)
  } catch (e) {
    showError("网络错误，请稍后重试")
  } finally {
    btn.disabled = false
    btn.textContent = "注 册"
  }
}

function showError(msg) {
  const el = document.getElementById("errorMsg")
  el.textContent = msg
  el.classList.add("show")
}

document.getElementById("password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") register()
})
document.getElementById("confirmPassword").addEventListener("keydown", (e) => {
  if (e.key === "Enter") register()
})
</script>
</body>
</html>
