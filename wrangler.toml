name = "classroom-qa"
main = "src/worker.js"
compatibility_date = "2025-05-14"

[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "CLASSROOM"
class_name = "ClassroomRoom"

[[d1_databases]]
binding = "DB"
database_name = "classroom-qa-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[migrations]]
tag = "v1"
new_classes = ["ClassroomRoom", "UserStore"]

[[migrations]]
tag = "v2"
deleted_classes = ["UserStore"]
